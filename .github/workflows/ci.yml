# Lint, type-check and test on every push to main and every pull request.
# Needs no secrets, no Docker and no Pitstop backup: the tests run on a
# synthetic fixture, and anything that needs the viewer or the backup
# (viewer/smoke.*, replay/pitstop/run.sh, demos/) is run by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pyright
      - run: uv run --frozen pytest
