# The trace viewer: one Jaeger v2 container (Phase 5, ADR-001 and ADR-007).
#   docker compose up -d      UI at http://127.0.0.1:16686
#                             OTLP/HTTP at http://127.0.0.1:4318
name: agent-observability

services:
  jaeger:
    # 2.22.0, pinned by digest.
    image: jaegertracing/jaeger@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./config.yaml:/etc/jaeger/config.yaml:ro
      - traces:/tmp
    ports:
      # Loopback only: the UI has no login (ADR-007).
      - "127.0.0.1:16686:16686" # UI and query API
      - "127.0.0.1:4318:4318" # OTLP over HTTP
      - "127.0.0.1:13133:13133" # health check
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  traces:
