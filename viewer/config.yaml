# Jaeger v2 (an OpenTelemetry Collector distribution): receives OTLP over
# HTTP, keeps traces in memory, serves the UI and query API. Phase 5,
# ADR-001. Ports are published on loopback only (compose.yaml).
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      attributes:
        - name: service.name
          value: jaeger
    metrics:
      level: none
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: memory_store
    http:
      endpoint: 0.0.0.0:16686

  jaeger_storage:
    backends:
      memory_store:
        # In memory, bounded by trace count. Badger was tried first and
        # peaked at 532 MiB while importing the harness's 1,777 replayed
        # traces (its write buffers and read cache can't be sized through
        # Jaeger), over the 256 MB limit. In memory, the same traces took
        # 72 MiB, so 5,000 of that size fit in about 180 MiB. Traces are
        # lost on a restart; the replays are idempotent and re-run in about
        # a minute, and live traces are a view, not the record.
        memory:
          max_traces: 5000

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: memory_store
