[project]
name = "agent-observability"
version = "0.1.0"
description = "One OpenTelemetry tracing pipeline across agent projects"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pyright>=1.1",
    "pytest>=8.3",
]

[tool.uv]
# Only versions published at least two weeks before this was set.
exclude-newer = "2026-10-13T00:00:00Z"
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.pyright]
typeCheckingMode = "strict"
# demos/ runs in the environment of the project it demonstrates;
# spikes/ are the throwaway Phase 6 scripts, kept as a record.
exclude = ["demos", "spikes", ".venv"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
