[project]
name = "agent-observability"
version = "0.1.0"
description = "One OpenTelemetry tracing pipeline across agent projects"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pyright>=1.1",
    "pytest>=8.3",
]

[tool.uv]
# Only versions published at least two weeks before this was set.
exclude-newer = "2026-10-13T00:00:00Z"
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# C901 and PLR09xx keep functions small as they're written (CLAUDE.md,
# "Keep it lean while writing").
extend-select = ["I", "B", "UP", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Test helpers build records field by field, so they take a field each.
"tests/**" = ["PLR0913"]

[tool.pyright]
typeCheckingMode = "strict"
# demos/ runs in the environment of the project it demonstrates.
exclude = ["demos", ".venv"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
